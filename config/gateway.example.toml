# inference-gateway domain config.
#
# Process settings (listen addresses, TLS, timeouts, log format) are flags or
# IG_* env vars, not keys here. Run `inference-gateway --help` for the list.

# Clients reach an upstream at /{name}/..., e.g.
#   ANTHROPIC_BASE_URL=http://localhost:8080/anthropic
#   OPENAI_BASE_URL=http://localhost:8080/openai/v1
# Client API keys pass through unchanged; the gateway holds none.

[[upstreams]]
name = "anthropic"
provider = "anthropic"
base_url = "https://api.anthropic.com"

[[upstreams]]
name = "openai"
provider = "openai"            # also for vLLM, Ollama, OpenRouter, ...
base_url = "https://api.openai.com"
# Add stream_options.include_usage to streaming requests so usage is observed.
# Clients then also receive the final usage chunk (empty `choices`).
inject_stream_usage = true

[ingress]
# Client networks allowed to use the proxy; empty allows all.
allow_cidrs = []
# Require `x-gateway-token` to equal the IG_GATEWAY_TOKEN env var.
require_token = false

# Modules: a present section enables the module. A section for a module whose
# cargo feature is off is a startup error.

# Sets cost_usd per request from a public price list in LiteLLM's format,
# fetched at startup and every `refresh` in the background. The list is
# community-maintained, so cost is an estimate: standard tier, with the higher
# rates for long prompts; batch, flex and priority prices are not read.
[cost]
# source_url = "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
# refresh = "6h"
# Last good download, used at startup. Relative to this file.
# cache_file = "pricing-cache.json"

# USD per million tokens, only for models the list lacks (self-hosted, just
# released). The list wins once it has the model.
# A model id matches a key exactly, or as key + "-" + a date suffix.
# cache_read and cache_write (5-minute TTL) default to input; cache_write_1h
# defaults to cache_write.
# [cost.models."my-local-model"]
# input = 0.0
# output = 0.0

# Serves metrics on the admin listener at /metrics.
[prometheus]

# Persists every trace, and captured content, in SQLite. Relative paths are
# relative to this file.
[store]
path = "gateway.db"

# One span per request, sent as OTLP/HTTP JSON to {endpoint}/v1/traces, with
# gen_ai.* attributes and no content. A client `traceparent` puts the span in
# the caller's trace and decides sampling for it.
# [otel]
# endpoint = "http://localhost:4318"
# service_name = "inference-gateway"
# sample_ratio = 1.0    # share of traces without a traceparent
# flush = "2s"          # export interval; also every 512 spans
# timeout = "10s"

# Content capture (prompts and responses). Needs [store].
[capture]
max_bytes = "8 MiB"   # raw-response copy; longer responses are stored truncated
retention = "30d"     # content only; trace rows are kept

# First matching rule wins; no match means no capture. All `match` keys are
# optional. `x-gateway-capture: 0|1` overrides a rule only with
# allow_header_override.
[[capture.rules]]
match = { upstream = "anthropic", tags = { project = "gateway-dev" } }
capture = true
allow_header_override = true

[[capture.rules]]
match = { model = "claude-haiku-*" }
sample = 0.25         # deterministic per trace id

# Scores captured traces with a System One judge model (tested: Typesafe Jev),
# asynchronously. Needs [store]; only captured traces with outcome ok are
# enqueued. Workers also run standalone:
# `inference-gateway eval run --config <file>` on the same database.
# [eval]
# concurrency = 4       # jobs in flight = concurrent judge calls
# max_attempts = 5      # 408/429/5xx/timeouts/invalid answers are retried
# lease = "5m"          # a crashed worker's job is reclaimed after this
# poll = "1s"
#
# [eval.judge]
# base_url = "https://api.typesafe.ai"
# model = "jev-1.13.0"            # pin: jev-latest moves between releases
# api_key_env = "IG_JUDGE_API_KEY"
# max_state_tokens = 32000        # judge limit for state plus question
#
# One question per evaluator. Editing the model, state or question makes a new
# evaluator version; `inference-gateway eval backfill --evaluator NAME` scores
# old traces again under it.
# [[eval.evaluators]]
# name = "answered"
# # stop_reason (evaluators only): raw provider values. Agent turns that call a
# # tool end with tool_use and often carry no text; score answers on end_turn.
# # structured_output = false (evaluators only) skips requests for JSON output,
# # such as Claude Code's session-title call.
# match = { upstream = "anthropic", tags = { project = "gateway-dev" }, stop_reason = ["end_turn"], structured_output = false }
# sample = 1.0
# # Verdict in the score_verdicts view and dashboards; not part of the version,
# # so edits apply to stored scores. pass: labels from criteria (choice, score)
# # or "yes" / "no" (noul). No pass means no verdict.
# pass = ["correct", "partial"]
# min_confidence = 0.7            # below it the verdict is uncertain
# # Variables: last_user_message, output_text, system, conversation,
# # tool_calls, thinking, stop_reason.
# state = """
# <user>{{ last_user_message }}</user>
# <response>{{ output_text }}</response>
# """
#
# [eval.evaluators.question]
# type = "choice"                 # noul (probability of yes) | choice | score
# instructions = "Did the response address the request?"
#
# [eval.evaluators.question.criteria]
# correct = "Fully answers what was asked"
# partial = "Answers part of it"
# wrong = "Answers, but incorrectly"
# refused = ""                    # no description

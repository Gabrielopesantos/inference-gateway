# inference-gateway domain config.
#
# Process settings (listen addresses, TLS, timeouts, log format) are flags or
# IG_* env vars, not keys here. Run `inference-gateway --help` for the list.

# Clients reach an upstream at /{name}/..., e.g.
#   ANTHROPIC_BASE_URL=http://localhost:8080/anthropic
#   OPENAI_BASE_URL=http://localhost:8080/openai/v1
# Client API keys pass through unchanged; the gateway holds none.

[[upstreams]]
name = "anthropic"
provider = "anthropic"
base_url = "https://api.anthropic.com"

[[upstreams]]
name = "openai"
provider = "openai"            # also for vLLM, Ollama, OpenRouter, ...
base_url = "https://api.openai.com"
# Add stream_options.include_usage to streaming requests so usage is observed.
# Clients then also receive the final usage chunk (empty `choices`).
inject_stream_usage = true

[ingress]
# Client networks allowed to use the proxy; empty allows all.
allow_cidrs = []
# Require `x-gateway-token` to equal the IG_GATEWAY_TOKEN env var.
require_token = false

# Modules: a present section enables the module. A section for a module whose
# cargo feature is off is a startup error.

# Sets cost_usd per request. Relative paths are relative to this file.
# Prices come from pricing_file, from a fetched list, or both; pricing_file
# wins per model.
[cost]
pricing_file = "pricing.toml"
# Public list in LiteLLM's format, fetched at startup and every `refresh` in
# the background. Community-maintained: keep models whose cost must be exact
# in pricing_file. Tiered prices (>200k tokens, batch, priority) are not read.
# source_url = "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
# refresh = "6h"
# cache_file = "pricing-cache.json"   # last good download, used at startup

# Serves metrics on the admin listener at /metrics.
[prometheus]

# Persists every trace, and captured content, in SQLite. Relative paths are
# relative to this file.
[store]
path = "gateway.db"

# Content capture (prompts and responses). Needs [store].
[capture]
max_bytes = "8 MiB"   # raw-response copy; longer responses are stored truncated
retention = "30d"     # content only; trace rows are kept

# First matching rule wins; no match means no capture. All `match` keys are
# optional. `x-gateway-capture: 0|1` overrides a rule only with
# allow_header_override.
[[capture.rules]]
match = { upstream = "anthropic", tags = { project = "gateway-dev" } }
capture = true
allow_header_override = true

[[capture.rules]]
match = { model = "claude-haiku-*" }
sample = 0.25         # deterministic per trace id

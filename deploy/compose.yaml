# Gateway plus Grafana, Prometheus and Tempo (grafana/otel-lgtm).
#   nix build .#image && docker load < result
#   docker compose -f deploy/compose.yaml up -d
services:
  gateway:
    image: inference-gateway:dev
    restart: unless-stopped
    env_file:
      # IG_IDENTITY_SECRET, IG_JUDGE_API_KEY, IG_GATEWAY_TOKEN
      - path: .env
        required: false
    volumes:
      - ./gateway.toml:/etc/inference-gateway/gateway.toml:ro
      - ../config/pricing.toml:/etc/inference-gateway/pricing.toml:ro
      - gateway-data:/data
    ports:
      - 127.0.0.1:${GATEWAY_PORT:-8080}:8080
    depends_on:
      - lgtm

  lgtm:
    image: docker.io/grafana/otel-lgtm:0.35.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PLUGINS_PREINSTALL: frser-sqlite-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/gateway/gateway.json
    volumes:
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./grafana/provisioning/datasources/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./grafana/provisioning/dashboards/gateway.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/gateway.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/gateway:ro
      # Read by the SQLite datasource. Not :ro: a WAL reader writes the -shm file.
      - gateway-data:/gateway-data
      - lgtm-data:/data
    ports:
      - 127.0.0.1:3000:3000   # Grafana
      - 127.0.0.1:9091:9090   # Prometheus (9090 is the admin port of a gateway on the host)
      - 127.0.0.1:4318:4318   # OTLP/HTTP, for a gateway on the host
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  gateway-data:
  lgtm-data:

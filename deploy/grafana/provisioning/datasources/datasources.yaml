# Replaces otel-lgtm's datasources: same uids, a 5s Prometheus interval to
# match the scrape interval, and the gateway's SQLite store.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    url: http://127.0.0.1:4040

  - name: Gateway SQLite
    type: frser-sqlite-datasource
    uid: gateway-sqlite
    jsonData:
      path: /gateway-data/gateway.db
      pathPrefix: "file:"
      pathOptions: "?mode=ro"

  - name: Gateway SQLite (host)
    type: frser-sqlite-datasource
    uid: gateway-sqlite-host
    jsonData:
      path: /gateway-host/gateway.db
      pathPrefix: "file:"
      pathOptions: "?mode=ro"
